<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Meal Planner</title>
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --ink:#141414; --mut:#6b6b6b; --line:#e3e3df;
  --accent:#111; --good:#1a7f37; --warn:#9a6700; --bad:#b42318;
  --pad:env(safe-area-inset-bottom,0px);
  /* One colour per macro, used everywhere that macro appears so a figure is
     recognisable before you have read its label. */
  --m-kcal:#b45309; --m-protein:#1d4ed8; --m-fat:#a21caf; --m-carbs:#0f766e;
  --m-kcal-bg:#fdf3e7; --m-protein-bg:#eef2ff; --m-fat-bg:#fbf0fb; --m-carbs-bg:#ecf8f6;
  /* One colour per meal. Separate from the macro palette on purpose: these
     label which meal you are looking at, not which number. */
  --sl-breakfast:#c2410c; --sl-lunch:#15803d; --sl-dinner:#6d28d9; --sl-snack:#0369a1;
}
.k-kcal{color:var(--m-kcal)} .k-protein{color:var(--m-protein)}
.k-fat{color:var(--m-fat)} .k-carbs{color:var(--m-carbs)}
/* A dot carries the macro's colour where the text itself must stay readable. */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
  vertical-align:middle;flex:none}
.dot.k-kcal{background:var(--m-kcal)} .dot.k-protein{background:var(--m-protein)}
.dot.k-fat{background:var(--m-fat)} .dot.k-carbs{background:var(--m-carbs)}
/* How a figure is tracking against its goal. Independent of the macro colour:
   these say how you are doing, the macro colours say what you are looking at. */
.s-good{color:var(--good)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(64px + var(--pad))}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
  padding:14px 16px 12px;display:flex;align-items:baseline;gap:10px}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.2px}
header .sub{font-size:12px;opacity:.7;margin-left:auto;color:#fff}
main{padding:12px 12px 24px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 2px;font-weight:600}
.sub{font-size:12.5px;color:var(--mut)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink);padding:9px 12px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.sec{padding:6px 10px;font-size:13px}
.sec.on{border-color:var(--accent);font-weight:600}
.danger{color:var(--bad);border-color:#f0c2bc}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bar.tight{margin-top:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;
  border-top:1px solid var(--line);padding-bottom:var(--pad)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:11px 4px 9px;
  font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:17px;line-height:1}
nav button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2.5px 0 var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.facet{display:flex;align-items:center;gap:8px;margin-top:6px}
.facet .flab{flex:0 0 46px;font-size:10px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--mut);padding-bottom:6px}
.facet .chips{flex:1 1 auto;min-width:0}
.chip{white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
/* One colour per meal, so the selected meal reads before its label does. These
   are deliberately a separate family from the macro colours: a macro figure is
   always introduced by a round dot, a meal is always a pill. */
.chip.slot-breakfast{color:var(--sl-breakfast);border-color:#f0d9c4}
.chip.slot-lunch{color:var(--sl-lunch);border-color:#c9e3d2}
.chip.slot-dinner{color:var(--sl-dinner);border-color:#d9d0f2}
.chip.slot-snack{color:var(--sl-snack);border-color:#c5dcec}
.chip.slot-breakfast.on{background:var(--sl-breakfast);border-color:var(--sl-breakfast);color:#fff}
.chip.slot-lunch.on{background:var(--sl-lunch);border-color:var(--sl-lunch);color:#fff}
.chip.slot-dinner.on{background:var(--sl-dinner);border-color:var(--sl-dinner);color:#fff}
.chip.slot-snack.on{background:var(--sl-snack);border-color:var(--sl-snack);color:#fff}
.fsel{flex:1 1 auto;min-width:0;margin-bottom:6px;padding:8px 10px;font:inherit;font-size:13px;
  border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236b6b6b'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
.fsel.on{border-color:var(--accent);font-weight:600}
input[type=search],input[type=text],input[type=number],input[type=date]{width:100%;
  padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;
  color:var(--ink)}
label.fld{display:block;margin-bottom:10px}
label.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}

/* --- period switcher and date navigation --- */
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;border-radius:0;font-size:13px;padding:8px 4px;background:none}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.nav2{display:flex;align-items:center;gap:8px;margin-top:10px}
.nav2 .lbl{flex:1;text-align:center;font-weight:600;font-size:14px}
.nav2 button{padding:7px 13px}

/* --- macro summary --- */
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.macro{background:#fafaf8;border:1px solid var(--line);border-radius:10px;padding:8px 6px;
  text-align:center}
.macro b{display:block;font-size:16px;line-height:1.2}
.macro .of{font-size:10.5px;color:var(--mut)}
.macro span.nm{font-size:10px;text-transform:uppercase;letter-spacing:.3px;
  display:block;margin-bottom:3px;font-weight:600}
.macro.k-kcal{background:var(--m-kcal-bg);border-color:#f0ddc4}
.macro.k-protein{background:var(--m-protein-bg);border-color:#d5dcfa}
.macro.k-fat{background:var(--m-fat-bg);border-color:#efd9ef}
.macro.k-carbs{background:var(--m-carbs-bg);border-color:#cfe8e3}
/* Macro figures shown inline, under a meal name or on a recipe row. */
.mline{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mut)}
.stat{display:inline-flex;align-items:center;white-space:nowrap}
.stat small{font-size:11.5px;margin-left:2px}
.portions{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;
  color:var(--mut)}
.portions b{font-size:16px;color:var(--ink);min-width:18px;text-align:center}
.portions .step{padding:4px 11px;font-size:15px;line-height:1.1}

/* --- plan: day view (large tiles) --- */
.tile{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;
  margin-bottom:10px}
.tile .slotname{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.tile .mealname{font-size:16px;font-weight:600;margin:3px 0 2px}
.tile .mealname.empty{color:#a8a8a8;font-weight:400}

/* --- plan: week view (medium tiles) --- */
.wk{display:grid;gap:9px}
.wkday{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}
.wkday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wkday h3{margin:0;padding:8px 11px;font-size:12.5px;background:#fafaf8;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:6px}
.wkday h3 .kc{font-weight:600;font-size:11.5px;margin-left:auto}
.wkday h3 .dayclear{padding:0;width:20px;height:20px;line-height:1;font-size:15px;border:0;
  background:none;color:var(--mut);border-radius:6px;flex:none}
.wkday h3 .dayclear:hover:not(:disabled){background:#efefea;color:var(--bad)}
.wkday h3 .dayclear:disabled{opacity:.25}
.mini{display:flex;align-items:center;gap:8px;padding:7px 11px;width:100%;background:none;
  border:0;border-top:1px solid #f0f0ec;text-align:left;border-radius:0}
.mini:first-of-type{border-top:0}
.mini .lbl{font-size:10px;color:var(--mut);width:22px;flex:none;text-transform:uppercase}
.mini .lbl.slot-breakfast{color:var(--sl-breakfast)} .mini .lbl.slot-lunch{color:var(--sl-lunch)}
.mini .lbl.slot-dinner{color:var(--sl-dinner)} .mini .lbl.slot-snack{color:var(--sl-snack)}
.mini .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13px}
.mini .val.empty{color:#b4b4b0}
.mini .n{font-size:11px;color:var(--mut);white-space:nowrap}
@media (min-width:660px){ .wk{grid-template-columns:repeat(7,1fr)} .mini .lbl{display:none} }

/* --- plan: month view (small tiles) --- */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhead{font-size:10px;color:var(--mut);text-align:center;text-transform:uppercase;
  letter-spacing:.3px;padding-bottom:2px}
.mcell{border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px 2px 5px;
  min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;justify-content:flex-start}
.mcell.out{opacity:.35}
.mcell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mcell .dn{font-weight:600;font-size:12px}
.mcell .dots{display:flex;gap:2.5px}
.mcell .dots i{width:5px;height:5px;border-radius:50%;background:#dcdcd8;display:block}
.mcell .dots i.on{background:var(--accent)}
.tile.faint{opacity:.62}
.snk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.snk .snkmain{flex:1 1 190px;display:flex;flex-direction:column;gap:2px}
.snk .sub.after{opacity:.75;font-size:11px}
.dlist li button{margin-left:auto}
.slotname em{font-style:normal;font-weight:400;opacity:.55;font-size:11px}
.mcell .kc{font-size:9.5px;color:var(--mut);line-height:1}

/* --- recipes --- */
.rlist{list-style:none;margin:0;padding:0}
.rlist li{border-bottom:1px solid var(--line)}
.rlist li:last-child{border-bottom:0}
.ritem{display:flex;align-items:flex-start;gap:10px;padding:11px 2px;width:100%;
  background:none;border:0;text-align:left}
.ritem .nm{flex:1;min-width:0}
.ritem .nm b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ritem .nm small{color:var(--mut);font-size:12px}
.ritem .mline{margin-top:4px}
.kc{text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.kc b{display:block;color:var(--ink);font-size:14px}
.tag{display:inline-block;font-size:10.5px;padding:1.5px 6px;border-radius:5px;
  background:#efefec;color:#555;margin-right:4px}
.tag.veg{background:#e6f4ea;color:#1a7f37}
.tag.cat{background:#eef1f6;color:#4a5568}
.tag.lo{background:#e7f0fb;color:#1b5fa8}
.tag.lk{background:#f3ecfa;color:#6b3fa0}

/* --- fill settings --- */
.wkset{margin-top:6px;font-size:13px}
.wkrow{display:grid;grid-template-columns:76px repeat(7,1fr);gap:4px;align-items:center;
  margin-bottom:4px}
.wkrow.head span{text-align:center;font-size:11px;color:var(--mut)}
.wkrow>span:first-child{font-weight:600;text-align:left;font-size:12.5px}
.dbox{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 0;
  font-size:12px;line-height:1;color:var(--mut);cursor:pointer}
.dbox.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dbox.over{background:repeating-linear-gradient(45deg,#f4f4f2,#f4f4f2 3px,#fff 3px,#fff 6px);
  color:#b0b0b0}
.mini.off .val{color:var(--mut);font-style:italic}
.dots i.off{opacity:.25}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:#e7f0fb;color:#1b5fa8;
  font-size:12.5px;line-height:1.45}

/* --- sheets --- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet .inner{background:var(--bg);width:100%;max-height:88vh;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;padding-bottom:var(--pad)}
.sheet header{border-radius:16px 16px 0 0}
.sheet .body{overflow:auto;padding:12px}
.x{background:none;border:0;color:#fff;font-size:20px;padding:0 4px;line-height:1}
.ing{list-style:none;margin:8px 0 0;padding:0}
.ing li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px;display:flex;gap:8px}
.ing li:last-child{border-bottom:0}
.ing .g{margin-left:auto;color:var(--mut);font-size:12.5px;white-space:nowrap}
ol.steps{margin:8px 0 0;padding-left:18px}
ol.steps li{margin:6px 0}
.src{font-size:11.5px;color:var(--mut);margin-top:10px;font-style:italic}

/* --- shopping --- */
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it.done .itxt b{text-decoration:line-through;color:#a8a8a8}
.it.done .itxt{color:#a8a8a8}
.itxt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;font:inherit}
.itxt b{font-weight:600}
.itxt small{display:block;color:var(--mut);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ck{width:22px;height:22px;border-radius:6px;border:1.5px solid #c4c4c0;background:#fff;
  flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;padding:0}
.ck.on{background:var(--good);border-color:var(--good)}
.rm{border:0;background:none;color:var(--mut);font-size:17px;padding:2px 4px;line-height:1}
.aisle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--mut);margin:14px 0 2px}
.aisle:first-child{margin-top:0}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1}

/* --- nutrients --- */
.nrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow .nm{width:74px;flex:none;font-size:13px}
.nrow .barwrap{flex:1}
.nrow .fig{width:96px;text-align:right;font-size:12px;color:var(--mut);white-space:nowrap}
.nrow .fig b{color:var(--ink)}
/* The one bar that stays: the Nutrients page exists to compare against goals.
   Scoped to .barwrap so it cannot leak back into the macro cards, where an
   inline span with a percentage width rendered as a block over the figures. */
.barwrap .prog{display:block;height:6px;border-radius:3px;background:#e7e7e3;
  overflow:hidden}
.barwrap .prog i{display:block;height:100%;border-radius:3px;background:var(--good)}
.barwrap .prog i.s-warn{background:var(--warn)}
.barwrap .prog i.s-bad{background:var(--bad)}
.dlist{list-style:none;margin:0;padding:0;font-size:13px}
.dlist li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--line)}
.dlist li:last-child{border-bottom:0}

.empty-state{text-align:center;color:var(--mut);padding:30px 16px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + var(--pad));
  background:#222;color:#fff;padding:9px 15px;border-radius:999px;font-size:13px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.warnbar{background:#fff4e5;border:1px solid #f0d8b0;color:#7a4b00;font-size:12.5px;
  padding:9px 12px;border-radius:9px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>Meal Planner</h1><span class="sub" id="hsub"></span></header>
<main id="view"></main>
<nav>
  <button data-tab="plan" class="on"><span class="ic">&#128197;</span>Plan</button>
  <button data-tab="recipes"><span class="ic">&#127859;</span>Recipes</button>
  <button data-tab="nutrients"><span class="ic">&#128202;</span>Nutrients</button>
  <button data-tab="shop"><span class="ic">&#128722;</span>Shopping</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const DATA = __DATA__;
</script>
<script>
/* __SHOPPING_JS__ */
</script>
<script>
"use strict";

/* ===== constants and data ================================================ */
// The three meals of a day, plus an optional snack. A snack is a protein
// top-up, not a fourth meal: the main-meal catalogue cannot reach a useful
// protein figure inside the calorie goal on its own.
// Brunch is not a fourth meal but a replacement for two: on a brunch day you do
// not eat breakfast or lunch, and the one meal carries both their calories. It
// is kept out of DAILY_SLOTS so the parts of the app that ask what a normal day
// looks like are not thrown off by a meal most days do not have.
const DAILY_SLOTS = ["breakfast", "lunch", "dinner"];
const MAIN_SLOTS = ["breakfast", "brunch", "lunch", "dinner"];
const SLOTS = MAIN_SLOTS.concat("snack");
// What a recipe can be tagged with. Brunch is deliberately absent: the Recipes
// page browses the catalogue as it was written, and offering a Brunch filter
// would imply a tag no recipe carries.
const CATALOGUE_SLOTS = DAILY_SLOTS.concat("snack");
const SLOT_ABBR = { breakfast: "B", brunch: "Br", lunch: "L", dinner: "D", snack: "S" };
const SLOT_LABEL = { breakfast: "Breakfast", brunch: "Brunch", lunch: "Lunch",
                     dinner: "Dinner", snack: "Snack" };
// What a brunch may be made of. There is no `brunch` tag in the catalogue and
// there should not be: a brunch is an ordinary breakfast or lunch dish, and the
// thing that makes it brunch is that it has to do the work of both.
//
// Drawing on every breakfast and lunch is too loose -- the calorie target for a
// meal replacing two is high enough that a plain pool hands you roast gammon at
// eleven in the morning. Filtering by the catalogue's own categories keeps the
// things you would actually eat at that hour and still leaves 74 recipes, 22 of
// them over 700 kcal.
const BRUNCH_CATEGORIES = ["cooked-breakfast", "eggs", "toast-and-bakery",
  "bread-and-baked", "bakery-and-picky", "sandwiches", "jacket-potatoes"];
function servesSlot(r, slot){
  if (slot === "brunch"){
    return (r.slots.includes("breakfast") || r.slots.includes("lunch"))
      && BRUNCH_CATEGORIES.indexOf(r.category) !== -1;
  }
  return r.slots.includes(slot);
}
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MACROS = [
  // `dir` is how the goal should be read. Calories, fat and carbs are budgets you
  // stay under. Protein is a floor you are trying to reach, so the same "x of y"
  // reads the opposite way and has to be coloured the opposite way.
  { key: "kcal", label: "Calories", unit: "", dir: "budget" },
  { key: "protein", label: "Protein", unit: "g", dir: "target" },
  { key: "fat", label: "Fat", unit: "g", dir: "budget" },
  { key: "carbs", label: "Carbs", unit: "g", dir: "budget" },
];
const MACRO_BY_KEY = {};
MACROS.forEach(m => { MACRO_BY_KEY[m.key] = m; });
const KEY = "mealplanner.v3";
const OLD_KEY = "mealplanner.v2";

const RECIPES = DATA.recipes;
const FOODS = DATA.foods;
const BY_ID = {};
RECIPES.forEach(r => { BY_ID[r.id] = r; });

/* ===== dates =============================================================
 * All dates are handled as local YYYY-MM-DD strings. Date#toISOString is
 * deliberately avoided: it converts to UTC, which shifts the date by a day
 * during British Summer Time.
 */
function iso(d){
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}
function parseISO(s){
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function todayISO(){ return iso(new Date()); }
function addDays(s, n){ const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n){
  const d = parseISO(s);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  // Clamp: adding a month to the 31st must not skip into the following one.
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return iso(d);
}
function startOfWeek(s){
  const d = parseISO(s);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // weeks run Monday to Sunday
  return iso(d);
}
function startOfMonth(s){ const d = parseISO(s); return iso(new Date(d.getFullYear(), d.getMonth(), 1)); }
function endOfMonth(s){ const d = parseISO(s); return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
function dowName(s){ return DOW[(parseISO(s).getDay() + 6) % 7]; }
function daysBetween(a, b){
  const out = [];
  for (let c = a; c <= b; c = addDays(c, 1)) out.push(c);
  return out;
}
function fmtDate(s){
  const d = parseISO(s);
  return `${dowName(s)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
}
function fmtShort(s){
  const d = parseISO(s);
  return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`;
}

function blank(){
  return {
    plan: {},                       // "YYYY-MM-DD" -> { breakfast: id, ... }
    goals: Object.assign({}, DATA.targets),
    view: "week",                   // day | week | month
    cursor: todayISO(),
    // Which part of the catalogue "fill empty slots" is allowed to draw from.
    // The catalogue is a general cookbook, so filling from all of it happily
    // hits the calorie goal while leaving protein far short. null means anything.
    scope: null,                    // null | "high-protein" | "light"
    // Which days of the week each main meal is actually eaten, Mon..Sun. A slot
    // you do not eat is not an empty slot: fill leaves it alone and its share of
    // the day's calories goes to the meals you do eat.
    slotDays: { breakfast: FULL_WEEK(), lunch: FULL_WEEK(), dinner: FULL_WEEK(),
                brunch: NO_DAYS() },
    // Longest a main may take, prep and cook together, in minutes. 0 means no
    // limit. Weeknights and weekends are separate because they are different
    // kinds of evening.
    maxMin: { week: 0, weekend: 0 },
    leftovers: true,                // cook a batch dish once, eat it twice
    // A meal you always have, per slot: an id fill uses instead of choosing.
    // null means pick something different each day.
    usual: { breakfast: null, lunch: null, dinner: null },
    shopping: null,                 // { from, to, created, items: [...] }
  };
}

function FULL_WEEK(){ return [true, true, true, true, true, true, true]; }
function NO_DAYS(){ return [false, false, false, false, false, false, false]; }

/** Mon=0 .. Sun=6, matching DOW. */
function dowIdx(date){ return (parseISO(date).getDay() + 6) % 7; }
function isWeekend(date){ return dowIdx(date) >= 5; }

/** Is this a day you have brunch instead of breakfast and lunch? */
function isBrunchDay(date){
  const days = S.slotDays && S.slotDays.brunch;
  return Array.isArray(days) && days[dowIdx(date)] === true;
}

/** Do you eat this slot on this day? Snacks are a top-up, never on a schedule.
 *  Brunch does not sit alongside breakfast and lunch, it stands in for them, so
 *  a brunch day closes both regardless of what their own schedules say. */
function eats(date, slot){
  if (slot === "snack") return true;
  if (slot === "brunch") return isBrunchDay(date);
  if ((slot === "breakfast" || slot === "lunch") && isBrunchDay(date)) return false;
  const days = S.slotDays && S.slotDays[slot];
  if (!Array.isArray(days)) return true;
  return days[dowIdx(date)] !== false;
}

/** The slots worth showing for a day. A meal you are not having is only worth a
 *  line if it is one you might have: the breakfast you skip on Tuesdays reads as
 *  a deliberate gap, but a brunch slot on every ordinary day is just clutter. */
function visibleSlots(date){
  return SLOTS.filter(slot => {
    if (takenAt(date, slot)) return true;
    if (slot === "brunch") return isBrunchDay(date);
    if ((slot === "breakfast" || slot === "lunch") && isBrunchDay(date)) return false;
    return true;
  });
}

/** Minutes a main may take on this day, or 0 for no limit. */
function timeCap(date){
  const caps = S.maxMin || {};
  const cap = isWeekend(date) ? caps.weekend : caps.week;
  return cap > 0 ? cap : 0;
}

/* The week used to be stored against weekday names. Move any existing plan onto
 * this week's dates so an upgrade does not silently lose it. */
function migrate(state){
  try {
    const raw = localStorage.getItem(OLD_KEY);
    if (!raw) return state;
    const old = JSON.parse(raw);
    if (old && old.plan) {
      const monday = startOfWeek(todayISO());
      DOW.forEach((name, i) => {
        const day = old.plan[name];
        if (!day) return;
        const date = addDays(monday, i);
        SLOTS.forEach(slot => {
          if (day[slot] && BY_ID[day[slot]]) {
            state.plan[date] = state.plan[date] || {};
            state.plan[date][slot] = day[slot];
          }
        });
      });
    }
    localStorage.removeItem(OLD_KEY);
  } catch (e) { /* nothing worth recovering */ }
  return state;
}

/* Recipes are renamed and retired as the catalogue is edited, so a plan saved
 * against an older build can hold ids that no longer resolve. Left in place
 * they are invisible but not absent: the tile renders empty because the lookup
 * misses, yet the slot still counts as taken, so "fill empty slots" skips it
 * and the day can never be completed. Drop them on load so what is stored
 * matches what is shown. */
function prunePlan(plan){
  let dropped = 0;
  Object.keys(plan).forEach(date => {
    const day = plan[date];
    if (!day || typeof day !== "object"){ delete plan[date]; return; }
    SLOTS.forEach(slot => {
      if (day[slot] && !BY_ID[idOf(day[slot])]){ delete day[slot]; dropped++; }
    });
  });
  // Leftovers are only real because some other day cooked the dish. If that meal
  // has gone or been changed, what is left points at food that was never made --
  // and worse, it was deliberately left off the shopping list. Drop it too.
  Object.keys(plan).forEach(date => {
    const day = plan[date];
    SLOTS.forEach(slot => {
      const v = day[slot];
      if (isLeftover(v) && !cooks(plan, v.from, idOf(v))){ delete day[slot]; dropped++; }
    });
  });
  Object.keys(plan).forEach(date => {
    if (!Object.keys(plan[date]).length) delete plan[date];
  });
  return dropped;
}

/** Does `ref` ("YYYY-MM-DD|slot") hold a freshly cooked serving of `id`? */
function cooks(plan, ref, id){
  const parts = String(ref).split("|");
  const day = plan[parts[0]];
  if (!day) return false;
  const v = day[parts[1]];
  return !!v && idOf(v) === id && !isLeftover(v);
}

/** A saved schedule is only trusted as far as its shape: anything that is not
 *  seven booleans falls back to eating that meal every day, so a corrupt or
 *  half-written setting can never quietly stop meals being planned.
 *
 *  Brunch is the exception and defaults to no days. It replaces breakfast and
 *  lunch, so guessing it on would take two meals a day off everyone who saved a
 *  plan before brunch existed. */
function normaliseSlotDays(saved){
  const out = {};
  MAIN_SLOTS.forEach(slot => {
    const brunch = slot === "brunch";
    const days = saved && saved[slot];
    out[slot] = Array.isArray(days) && days.length === 7
      // Brunch has to be opted into explicitly; the others are only opted out of.
      ? days.map(v => (brunch ? v === true : v !== false))
      : (brunch ? NO_DAYS() : FULL_WEEK());
  });
  return out;
}

/** The meal you always have in this slot, or null. Checked against the
 *  catalogue every time rather than trusted: a pinned id can go stale exactly
 *  like a planned one, and a usual meal that no longer exists would otherwise
 *  stop fill planning that slot at all. */
function usualFor(slot){
  const id = S.usual && S.usual[slot];
  const r = id ? BY_ID[id] : null;
  return r && servesSlot(r, slot) ? r : null;
}

let S = blank();
let pruned = 0;
try {
  const raw = STORE_OK ? localStorage.getItem(KEY) : null;
  if (raw) {
    const saved = JSON.parse(raw);
    S = Object.assign(blank(), saved);
    S.goals = Object.assign({}, DATA.targets, saved.goals || {});
    S.slotDays = normaliseSlotDays(saved.slotDays);
    S.maxMin = Object.assign({ week: 0, weekend: 0 }, saved.maxMin || {});
    S.leftovers = saved.leftovers !== false;
    S.usual = Object.assign({ breakfast: null, lunch: null, dinner: null },
      saved.usual || {});
    if (!S.plan || typeof S.plan !== "object") S.plan = {};
    pruned = prunePlan(S.plan);
    if (pruned) save();
  } else if (STORE_OK) {
    S = migrate(S);
  }
} catch (e) { S = blank(); }

function save(){
  if (!STORE_OK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { STORE_OK = false; toast("Storage is full or blocked - changes are not being saved"); }
}

// The Filter dropdown is deliberately short. Recipes carry a dozen authored
// tags, which stay searchable and still show on a recipe, but a filter list
// that long is a menu to read rather than a control to use. These three are the
// ones that change which meal you would pick.
const FILTER_TAGS = [
  ["vegetarian", "Vegetarian"],
  ["light", "Light"],
  ["high-protein", "High protein"],
];

/** Recipes matching a filter set, used by both the Recipes tab and the picker. */
function filterRecipes(f){
  const q = f.q.trim().toLowerCase();
  return RECIPES.filter(r => {
    if (f.slot && !servesSlot(r, f.slot)) return false;
    if (f.cat && r.category !== f.cat) return false;
    if (!f.tags.every(t => r.tags.includes(t))) return false;
    if (q){
      const hay = (r.name + " " + r.tags.join(" ") + " " + catLabel(r.category) + " " +
        r.cuisine + " " + r.ingredients.map(i => i.display).join(" ")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/** The search box and filter controls. `ns` namespaces the hooks so the picker's
 *  copy and the Recipes tab's copy can coexist without fighting each other.
 *
 *  Meal stays as buttons because it is the one filter you change constantly and
 *  it is worth its screen space; each slot carries its own colour so the active
 *  meal is readable at a glance. Type and Filter are dropdowns: Type alone is 21
 *  entries, which is past the point where a scrolling chip strip is usable, and
 *  a closed select also shows the current choice without any horizontal hunting.
 *  The Type list only offers categories that exist within the chosen meal, so
 *  picking breakfast does not leave "Roasts" on the list. */
function filterControls(f, ns){
  const cats = [...new Set(RECIPES
    .filter(r => !f.slot || servesSlot(r, f.slot))
    .map(r => r.category))].sort((a, b) => catLabel(a).localeCompare(catLabel(b)));
  const row = (label, body) =>
    `<div class="facet"><span class="flab">${label}</span>${body}</div>`;
  const select = (hook, current, options, anyLabel) =>
    `<select class="fsel${current ? " on" : ""}" data-${hook}="${ns}">
      <option value="">${anyLabel}</option>
      ${options.map(([val, label]) =>
        `<option value="${esc(val)}" ${current === val ? "selected" : ""}>${esc(label)}</option>`
      ).join("")}
    </select>`;
  return `<input type="search" id="q-${ns}" data-search="${ns}"
      placeholder="Search recipes or ingredients..." value="${esc(f.q)}">
    ${row("Meal", `<div class="chips">${CATALOGUE_SLOTS.map(s =>
      `<button class="chip slot-${s} ${f.slot === s ? "on" : ""}" data-fslot="${ns}|${s}">${
        SLOT_LABEL[s]}</button>`).join("")}</div>`)}
    ${row("Type", select("fcatsel", f.cat, cats.map(c => [c, catLabel(c)]), "All types"))}
    ${row("Filter", `<div class="chips">${FILTER_TAGS.map(([id, label]) =>
      `<button class="chip${f.tags.includes(id) ? " on" : ""}" data-ftag="${ns}|${id}">${
        label}</button>`).join("")}</div>`)}`;
}

/* ===== helpers =========================================================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let toastT;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("on"), 2200);
}

/* A planned slot holds either a bare recipe id, or an object carrying that id
 * alongside how it got there. Leftovers ({from: "date|slot"}) are eaten but not
 * cooked again, so they count towards the day's nutrition and never towards the
 * shopping list. A locked meal ({lock: 1}) survives Clear. Ordinary meals are
 * still written as plain strings, so plans saved by older builds load unchanged
 * and nothing has to be migrated. */
function idOf(v){ return typeof v === "string" ? v : (v && v.id) || null; }
function isLeftover(v){ return !!(v && typeof v === "object" && v.from); }
function isLocked(v){ return !!(v && typeof v === "object" && v.lock); }
function slotAt(date, slot){ return (S.plan[date] || {})[slot] || null; }
function mealAt(date, slot){ return BY_ID[idOf(slotAt(date, slot))] || null; }
/** Is this slot spoken for? Distinct from mealAt, which resolves the recipe. */
function takenAt(date, slot){ return !!idOf(slotAt(date, slot)); }

function mealsOn(date){
  return SLOTS.map(s => mealAt(date, s)).filter(Boolean);
}
function totalsOn(date){
  return mealsOn(date).reduce((a, r) => ({
    kcal: a.kcal + r.macros.kcal,
    protein: a.protein + r.macros.protein,
    fat: a.fat + r.macros.fat,
    carbs: a.carbs + r.macros.carbs,
  }), { kcal:0, protein:0, fat:0, carbs:0 });
}

/** The date range the Plan and Nutrients pages are currently showing. */
function range(){
  if (S.view === "day") return [S.cursor, S.cursor];
  if (S.view === "week") { const a = startOfWeek(S.cursor); return [a, addDays(a, 6)]; }
  return [startOfMonth(S.cursor), endOfMonth(S.cursor)];
}
function rangeLabel(){
  const [a, b] = range();
  if (S.view === "day") return fmtDate(a);
  if (S.view === "week") return `${fmtShort(a)} - ${fmtShort(b)}`;
  const d = parseISO(a);
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
/** Every recipe id planned between two dates.
 *
 * `cookedOnly` leaves out leftovers. They are eaten from a batch that was
 * already cooked and already shopped for, so counting them again would buy
 * their ingredients a second time and you would shop for two dinners to cook
 * one. Nutrition wants every serving; the shopping list wants only the cooking.
 */
function idsIn(a, b, cookedOnly){
  const out = [];
  daysBetween(a, b).forEach(date => {
    const day = S.plan[date] || {};
    SLOTS.forEach(s => {
      const id = idOf(day[s]);
      if (!id || !BY_ID[id]) return;
      if (cookedOnly && isLeftover(day[s])) return;
      out.push(id);
    });
  });
  return out;
}

/** Totals for a range, plus an average over the days that actually have meals.
 *  Averaging over every day in a month would be meaningless when only a few
 *  days are planned, so `days` counts planned days only. */
function summarise(a, b){
  const total = { kcal:0, protein:0, fat:0, carbs:0 };
  let days = 0;
  daysBetween(a, b).forEach(date => {
    const meals = mealsOn(date);
    if (!meals.length) return;
    days++;
    const t = totalsOn(date);
    MACROS.forEach(m => { total[m.key] += t[m.key]; });
  });
  const avg = {};
  MACROS.forEach(m => { avg[m.key] = days ? Math.round(total[m.key] / days) : 0; });
  return { total, avg, days };
}

    <div class="bar tight" style="margin-top:8px"><button class="sec" data-today="1">Today</button></div>`;
}

/** How a figure is tracking against its goal, as a CSS class.
 *
 * A budget (calories, fat, carbs) is comfortable while there is room left, gets
 * a warning as it fills, and turns bad once it is exceeded. A target (protein)
 * is the mirror image: bad while you are well short, good once you arrive.
 * Going over a protein goal is not a problem, so it stays good.
 */
function statusClass(value, goal, dir){
  if (!goal) return "";
  const pct = value / goal;
  if (dir === "target") return pct >= 0.95 ? "s-good" : pct >= 0.8 ? "s-warn" : "s-bad";
  return pct > 1.02 ? "s-bad" : pct >= 0.9 ? "s-warn" : "s-good";
}


/** The macro dashboard. Figures carry their macro's own colour but no
 *  good/warning/over status: the Nutrients tab is where a day is scored, and
 *  colouring the same numbers here made the plan read as a verdict on every
 *  glance rather than as a list of what you are eating. */
function macroCards(values, goals, caption){
  return `<div class="macros">${MACROS.map(m => {
    const v = values[m.key], g = goals[m.key] || 0;
    return `<div class="macro k-${m.key}"><span class="nm k-${m.key}">${m.label}</span>
      <b>${v}${m.unit}</b>${
      g ? `<span class="of">of ${g}${m.unit}</span>` : ""}</div>`;
  }).join("")}</div>${caption ? `<div class="sub" style="margin-top:8px">${esc(caption)}</div>` : ""}`;
}

/** The compact macro line under a meal name. Colour identifies each figure. */
function macroLine(macros){
  return `<span class="mline">${MACROS.map(m =>
    `<span class="stat"><i class="dot k-${m.key}"></i>${macros[m.key]}${
      m.unit || " kcal"}</span>`).join("")}</span>`;
}

/* ===== plan ============================================================== */
function viewPlan(){
  const [a, b] = range();
  const isDay = S.view === "day";

  // The dashboard belongs to the day view only. Over a week or a month it could
  // only show an average, which reads like a score for a period you are still
  // half way through planning; the Nutrients tab is the place for that figure.
  const dash = isDay
    ? `<div class="card">${macroCards(totalsOn(S.cursor), S.goals,
        mealsOn(S.cursor).length ? "" : "Nothing planned for this day yet.")}</div>`
    : "";

  let html = `<div class="card">${segmented()}</div>
    ${dash}
    <div class="card"><div class="bar tight">
      <button class="sec" data-fill="1">Fill empty slots</button>
      <button class="sec" data-copyprev="1">Copy ${PREVIOUS_LABEL[S.view]}</button>
      <button class="sec danger" data-clear="1">Clear ${S.view}</button>
    </div>
    <div class="facet">
      <span class="flab">Fill with</span>
      <div class="chips">${SCOPES.map(sc => `<button class="chip${S.scope === sc.id ? " on" : ""}" `
        + `data-scope="${sc.id === null ? "" : sc.id}">${sc.label}</button>`).join("")}</div>
    </div>
    <div class="bar tight"><button class="sec" data-fillset="1" style="width:100%">
      Fill settings &middot; ${esc(fillSummary())}</button></div>
    </div>`;

  if (isDay) html += dayTiles(S.cursor);
  else if (S.view === "week") html += weekGrid(a, b);
  else html += monthGrid(a, b);
  return html;
}

/** One line describing how fill is currently set up, for the button that opens
 *  the settings. Only mentions what has been changed from the defaults, so the
 *  button stays quiet until there is something worth saying. */
function fillSummary(){
  const bits = [];
  MAIN_SLOTS.forEach(s => {
    const r = usualFor(s);
    if (r) bits.push(`${SLOT_LABEL[s].toLowerCase()} is always ${r.name.toLowerCase()}`);
  });
  const brunch = DOW.filter((d, i) => S.slotDays.brunch[i]);
  if (brunch.length){
    bits.push(brunch.length === 7 ? "brunch every day" : `brunch ${brunch.join(", ")}`);
  }
  // Counted as days you actually eat them, not as days you ticked: with brunch
  // on at the weekend, breakfast reads 5/7 however its own row looks.
  DAILY_SLOTS.forEach(s => {
    const n = S.slotDays[s].filter((v, i) =>
      v && !(s !== "dinner" && S.slotDays.brunch[i])).length;
    if (n < 7) bits.push(`${SLOT_LABEL[s].toLowerCase()} ${n}/7`);
  });
  const caps = [];
  if (S.maxMin.week) caps.push(`${S.maxMin.week} min weeknights`);
  if (S.maxMin.weekend) caps.push(`${S.maxMin.weekend} min weekends`);
  if (caps.length) bits.push(caps.join(", "));
  if (!S.leftovers) bits.push("no leftovers");
  return bits.length ? bits.join(" \u00b7 ") : "every meal, every day";
}

/** What pinning has already spent of a day's calories. Counted rather than
 *  promised: a usual meal that takes most of the goal leaves fill very little to
 *  work with, and it is better to see that here than to wonder later why dinner
 *  keeps coming out a salad. */
function usualNote(){
  const pinned = MAIN_SLOTS.map(s => usualFor(s)).filter(Boolean);
  if (!pinned.length) return "Nothing pinned: fill chooses every meal.";
  // Brunch never shares a day with breakfast or lunch, so adding its calories to
  // theirs would describe a day nobody eats. It gets its own sentence.
  const daily = DAILY_SLOTS.map(s => usualFor(s)).filter(Boolean);
  const brunch = usualFor("brunch");
  const kcal = daily.reduce((n, r) => n + r.macros.kcal, 0);
  const prot = daily.reduce((n, r) => n + r.macros.protein, 0);
  const left = S.goals.kcal - kcal;
  const brunchBit = brunch
    ? ` Brunch days start with ${brunch.name} at ${brunch.macros.kcal} kcal.`
    : "";
  if (!daily.length) return `${pinned.length} pinned.${brunchBit}`;
  const spent = `${daily.length} pinned, taking ${kcal} kcal and ${prot} g protein`
    + ` of your ${S.goals.kcal} kcal goal`;
  return (left > 0
    ? `${spent}, leaving ${left} kcal for the rest of the day.`
    : `${spent} - which is already over it, so fill has nothing left to give.`) + brunchBit;
}

/** How much of the catalogue the chosen limits actually leave to choose from.
 *  Counted rather than promised: a limit that strands the pool would silently be
 *  ignored at fill time, so it is better to say so here. */
function capNote(){
  const mains = RECIPES.filter(r => ["lunch", "dinner"].some(s => r.slots.includes(s)));
  return [["week", "Weeknights"], ["weekend", "Weekends"]]
    .filter(([key]) => S.maxMin[key])
    .map(([key, label]) => {
      const n = mains.filter(r => (r.total_min || 0) <= S.maxMin[key]).length;
      return `${label}: ${n} of ${mains.length} lunches and dinners fit.`;
    }).join(" ") || `All ${mains.length} lunches and dinners are available.`;
}

function dayTiles(date){
  return visibleSlots(date).map(slot => {
    const v = slotAt(date, slot);
    const r = mealAt(date, slot);

    return `<div class="tile${(optional || off) && !r ? " faint" : ""}">

        r ? esc(r.name) : optional ? "No snack needed" : off ? "Not eaten today" : "Nothing chosen"}</div>

function monthGrid(a, b){

/* ===== nutrients ========================================================= */
/** Snacks ranked by how much of the day's protein gap they close.
 *
 * A snack is only worth eating here if it buys protein without spending
 * calories the day cannot spare, so anything that would push the day over its
 * calorie goal is dropped rather than shown and quietly ignored.
 */
function snackOptions(date, limit){
  const day = totalsOn(date);
  const gap = Math.max(0, S.goals.protein - day.protein);
  const headroom = Math.max(0, S.goals.kcal - day.kcal);
  return RECIPES
    .filter(r => r.slots.includes("snack") && r.macros.kcal <= headroom)
    .map(r => ({
      recipe: r,
      closes: gap ? Math.min(r.macros.protein, gap) : 0,
      after: {
        kcal: day.kcal + r.macros.kcal,
        protein: day.protein + r.macros.protein,
        fat: day.fat + r.macros.fat,
        carbs: day.carbs + r.macros.carbs,
      },
    }))
    .sort((x, y) => y.closes - x.closes
      || x.recipe.macros.kcal - y.recipe.macros.kcal)
    .slice(0, limit);
}

/** The Nutrients page's snack picker: what a snack would do to this day. */
function snackCard(date){
  if (!mealsOn(date).length) return "";
  const current = idOf(slotAt(date, "snack"));
  const day = totalsOn(date);
  const gap = S.goals.protein - day.protein;

  if (current){
    const r = BY_ID[current];
    return `<div class="card"><div class="hd"><div>
        <h2>Snack</h2>
        <div class="sub">Already counted in the figures above.</div>
      </div></div>
      <div class="snk">
        <div class="snkmain"><b>${esc(r.name)}</b>
          <span class="sub">${macroLine(r.macros)}</span></div>
        <div class="bar tight">
          <button class="sec" data-open="${r.id}">Recipe</button>
          <button class="sec" data-pick="${date}|snack">Swap</button>
          <button class="sec danger" data-unset="${date}|snack">Remove</button>
        </div>
      </div></div>`;
  }

  const opts = snackOptions(date, 4);
  const lead = gap > 0
    ? `${gap} g short on protein. These fit the calories you have left.`
    : `Protein goal met. These still fit the calories you have left.`;
  if (!opts.length){
    return `<div class="card"><div class="hd"><div><h2>Add a snack</h2>
      <div class="sub">${gap > 0
        ? `${gap} g short on protein, but no snack fits the calories left today.`
        : "No calories left today."}</div></div></div></div>`;
  }

  return `<div class="card"><div class="hd"><div>
      <h2>Add a snack</h2><div class="sub">${lead}</div>
    </div></div>
    ${opts.map(o => `<div class="snk">
      <div class="snkmain"><b>${esc(o.recipe.name)}</b>
        <span class="sub"><span class="stat"><i class="dot k-kcal"></i>+${
          o.recipe.macros.kcal} kcal</span> <span class="stat"><i class="dot k-protein"></i>+${
          o.recipe.macros.protein} g</span></span>
        <span class="sub after">Day becomes ${macroLine(o.after)}</span>
      </div>
      <div class="bar tight">
        <button class="sec" data-open="${o.recipe.id}">Recipe</button>
        <button class="sec pri" data-addsnack="${date}|${o.recipe.id}">Add</button>
      </div>
    </div>`).join("")}</div>`;
}

function viewNutrients(){
  const [a, b] = range();
  const s = summarise(a, b);
  const isDay = S.view === "day";
  const values = isDay ? totalsOn(S.cursor) : s.avg;

  let html = `<div class="card">${segmented()}</div>`;

  html += `<div class="card"><div class="hd"><div>
    <h2>${isDay ? "This day" : "Daily average"}</h2>
    <div class="sub">${isDay
      ? esc(fmtDate(S.cursor))
      : s.days
        ? `across ${s.days} planned day${s.days === 1 ? "" : "s"} in ${esc(rangeLabel())}`
        : `nothing planned in ${esc(rangeLabel())}`}</div>
  </div></div>`;

  html += MACROS.map(m => {
    const v = values[m.key], g = S.goals[m.key] || 0;
    const pct = g ? Math.min(Math.round((v / g) * 100), 100) : 0;
    const diff = v - g;
    const cls = statusClass(v, g, m.dir);
    return `<div class="nrow">
      <span class="nm k-${m.key}"><i class="dot k-${m.key}"></i>${m.label}</span>
      <span class="barwrap"><span class="prog"><i class="${cls}" style="width:${pct}%"></i></span></span>
      <span class="fig"><b class="${cls}">${v}${m.unit}</b> / ${g}${m.unit}
        <br>${diff === 0 ? "on target" : (diff > 0 ? "+" : "") + diff + m.unit}</span>
    </div>`;
  }).join("");
  html += `</div>`;

  if (isDay) html += snackCard(S.cursor);

  if (!isDay && s.days){
    const short = daysBetween(a, b)
      .filter(d => mealsOn(d).length && totalsOn(d).protein < S.goals.protein)
      .map(d => ({ date: d, by: S.goals.protein - totalsOn(d).protein }));
    if (short.length){
      html += `<div class="card"><div class="hd"><div>
        <h2>Short on protein</h2>
        <div class="sub">${short.length} of ${s.days} planned day${
          s.days === 1 ? "" : "s"}. Open one to add a snack.</div>
      </div></div><ul class="dlist">${short.map(x =>
        `<li><span>${esc(fmtDate(x.date))}</span>
          <span class="sub">${x.by} g short</span>
          <button class="sec" data-day="${x.date}">Open</button></li>`).join("")}</ul></div>`;
    }
  }

  html += `<div class="card"><div class="hd"><div>
      <h2>Daily goals</h2>
      <div class="sub">Used across the app to score your days.</div>
    </div></div>
    <form id="goalf">
      ${MACROS.map(m => `<label class="fld"><span class="k-${m.key}"><i class="dot k-${m.key}"></i>${
        m.label}${m.unit ? " (" + m.unit + ")" : ""}</span>
        <input type="number" inputmode="numeric" min="0" max="20000"
          name="${m.key}" value="${S.goals[m.key]}"></label>`).join("")}
      <div class="bar tight">
        <button class="pri" type="submit">Save goals</button>
        <button class="sec" type="button" data-resetgoals="1">Reset to defaults</button>
      </div>
    </form></div>`;
  return html;
}

/* ===== shopping ==========================================================
 * The list is a snapshot: it is generated from a chosen date range and then
 * owned by the user. Editing the plan afterwards does not silently rewrite it,
 * which is what makes "start over" meaningful.
 */
let itemSeq = 0;
function newItemId(){ return "i" + Date.now().toString(36) + (itemSeq++).toString(36); }

function generateList(from, to, includeStaples){
  const ids = idsIn(from, to, true);
  const lines = buildShoppingList(RECIPES, FOODS, ids);
  const items = lines
    .filter(l => includeStaples || l.aisle !== "cupboard")
    .map(l => ({
      id: newItemId(),
      name: l.group,
      qty: l.quantity,
      aisle: l.aisle,
      aisleLabel: l.aisle_label,
      note: l.merged
        ? l.components.map(c => c.food).join(" + ")
        : Array.from(new Set(l.components[0].recipes.map(id => BY_ID[id] ? BY_ID[id].name : id)))
            .slice(0, 2).join(", "),
      ticked: false,
      manual: false,
    }));
  return { from, to, created: new Date().toISOString(), items };
}

/* A list with no days behind it: everything on it was put there by hand. */
function blankList(){
  return { from: null, to: null, created: new Date().toISOString(), items: [] };
}

function viewShop(){
  if (!S.shopping){
    return `<div class="card"><div class="empty-state">
        No shopping list yet.<br>Build one from the days you want to shop for, or start empty.
      </div>
      <div class="bar">
        <button class="pri" data-newlist="1" style="flex:1">Create from the plan</button>
        <button class="sec" data-blank="1" style="flex:1">Blank list</button>
      </div>
    </div>`;
  }

  const sh = S.shopping;
  const left = sh.items.filter(i => !i.ticked).length;
  // A blank list has no dates to describe, so it says what it is instead.
  const span = sh.from
    ? (sh.from === sh.to ? fmtDate(sh.from) : `${fmtShort(sh.from)} - ${fmtShort(sh.to)}`)
    : null;

  let html = `<div class="card"><div class="hd"><div>
      <h2>Shopping list</h2>
      <div class="sub">${span ? `For ${esc(span)}` : "Your own list"} &middot; ${
        sh.items.length} item${sh.items.length === 1 ? "" : "s"}, ${left} left</div>
    </div></div>
    <div class="bar tight">
      <button class="sec" data-newlist="1">Start over</button>
      <button class="sec" data-untick="1">Clear ticks</button>
      <button class="sec danger" data-clearitems="1">Clear</button>
      <button class="sec" data-copy="1">Copy</button>
    </div></div>`;

  if (!sh.items.length){
    html += `<div class="card"><div class="empty-state">
      This list is empty. Add an item below, or start over to pick different days.
    </div>${addForm()}</div>`;
    return html;
  }

  const order = (typeof AISLE_ORDER !== "undefined") ? AISLE_ORDER : [];
  // Anything not in the shop's aisle order (your own additions) belongs at the end.
  const rank = aisle => { const i = order.indexOf(aisle); return i === -1 ? order.length : i; };
  const byAisle = {};
  sh.items.forEach(i => { (byAisle[i.aisleLabel] = byAisle[i.aisleLabel] || []).push(i); });
  const labels = Object.keys(byAisle).sort((x, y) =>
    rank(byAisle[x][0].aisle) - rank(byAisle[y][0].aisle));

  let body = "";
  labels.forEach(label => {
    body += `<div class="aisle">${esc(label)}</div>`;
    byAisle[label].forEach(i => {
      body += `<div class="it ${i.ticked ? "done" : ""}">
        <button class="ck ${i.ticked ? "on" : ""}" data-tick="${i.id}"
          aria-label="Tick off">${i.ticked ? "&#10003;" : ""}</button>
        <button class="itxt" data-edit="${i.id}">
          <b>${esc(i.name)}</b>${i.qty ? ` &mdash; ${esc(i.qty)}` : ""}
          <small>${esc(i.note || (i.manual ? "added by you" : ""))}</small>
        </button>
        <button class="rm" data-rm="${i.id}" aria-label="Remove">&times;</button>
      </div>`;
    });
  });

  html += `<div class="card">${body}${addForm()}</div>`;
  return html;
}

function createList(from, to, staples){
  if (to < from){ toast("The end date is before the start date"); return; }
  const list = generateList(from, to, staples !== false);
  if (!list.items.length){
    toast("No meals planned in those days, so there is nothing to buy");
    return;
  }
  S.shopping = list;
  save();
  closeSheet();
  tab = "shop";
  render();
  toast(`${list.items.length} items to cook ${idsIn(from, to, true).length} meals`);
}

function copyList(){
  if (!S.shopping) return;
  const text = S.shopping.items
    .map(i => `- ${i.name}${i.qty ? " - " + i.qty : ""}${i.ticked ? " (got it)" : ""}`)
    .join("\n");
  const done = () => toast("List copied");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => toast("Could not copy"));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Could not copy"); }
    ta.remove();
  }
}

function render(){
  const warn = STORE_OK ? "" :
    `<div class="warnbar">This browser is blocking local storage, so your plan will not be
     remembered after you close the page.</div>`;
  document.getElementById("view").innerHTML = warn + (
    tab === "plan" ? viewPlan() :
    tab === "recipes" ? viewRecipes() :
    tab === "nutrients" ? viewNutrients() : viewShop());
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));

  // Only ever describes the tab you are on. A running count of planned days
  // outranked everything, so it followed you onto Recipes and Nutrients where
  // it meant nothing, and on the plan it restated what is already on screen.
  document.getElementById("hsub").textContent =
    tab === "shop" && S.shopping
      ? `${S.shopping.items.filter(i => !i.ticked).length} to buy`
      : tab === "recipes" ? `${RECIPES.length} recipes`
      : "";
}

/** Round a scaled weight the way a kitchen scale would show it. */
function scaleGrams(grams, n){
  const v = grams * n;
  return v >= 10 ? Math.round(v) : Math.round(v * 10) / 10;
}

// Quantities written into an ingredient line, in the forms recipes actually use:
// a whole number, a decimal, a simple fraction, a mixed number, or a typographic
// fraction. Anything else ("a knob of butter") has no number to multiply.
const VULGAR = { "\u00bc": 0.25, "\u00bd": 0.5, "\u00be": 0.75, "\u2153": 1 / 3, "\u2154": 2 / 3 };
const LEADING_QTY =
  /^(\s*)(\d+\s+\d+\s*\/\s*\d+|\d+\s*\/\s*\d+|\d+(?:\.\d+)?|[\u00bc\u00bd\u00be\u2153\u2154])(\s*)/;

function parseQty(token){
  const tok = token.trim();
  if (VULGAR[tok] !== undefined) return VULGAR[tok];
  const mixed = tok.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (mixed) return Number(mixed[1]) + Number(mixed[2]) / Number(mixed[3]);
  const frac = tok.match(/^(\d+)\s*\/\s*(\d+)$/);
  if (frac) return Number(frac[1]) / Number(frac[2]);
  return Number(tok);
}

/** Write a quantity back the way a recipe would: whole numbers plain, the usual
 *  kitchen fractions as fractions, and anything else to one decimal place. */
function fmtQty(v){
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  const whole = Math.floor(v), rem = v - whole;
  const FRACTIONS = [[0.25, "1/4"], [1 / 3, "1/3"], [0.5, "1/2"], [2 / 3, "2/3"], [0.75, "3/4"]];
  for (const [val, text] of FRACTIONS){
    if (Math.abs(rem - val) < 0.02) return whole ? `${whole} ${text}` : text;
  }
  return String(Math.round(v * 10) / 10);
}

/** Scale the quantity written into an ingredient line.
 *
 * This multiplies the number in the text rather than prefixing "2 x", so that
 * three portions of a recipe calling for "1/2 tin chopped tomatoes" reads
 * "1 1/2 tin chopped tomatoes" and you can shop and cook straight from it.
 * Lines with no stated number ("a knob of butter") are left alone: there is
 * nothing to multiply, and the gram weight beside them already scales.
 */
function scaleDisplay(display, n){
  if (n === 1) return display;
  const m = display.match(LEADING_QTY);
  if (!m) return display;
  const v = parseQty(m[2]);
  if (!isFinite(v) || v <= 0) return display;
  return m[1] + fmtQty(v * n) + m[3] + display.slice(m[0].length);
}

function recipeSheet(id, portions){

  if (!r) return;
  // Portions scale the shopping and cooking quantities only. A planned slot is

  const n = Math.min(Math.max(Math.round(portions || 1), 1), 8);
  const src = r.source && r.source.name
