/* ===== plan mutations ==================================================== */
function setMeal(date, slot, id, extra){
  if (!S.plan[date]) S.plan[date] = {};
  const prev = S.plan[date][slot];
  // Swapping the dish out means the batch it came from was never cooked, so
  // anything eating its leftovers has to go with it.
  if (idOf(prev) !== id) dropLeftoversOf(date, slot);
  const meta = Object.assign({}, extra);
  // A lock is about the slot, not the dish: choosing something else by hand is
  // a deliberate act, and it should stay protected from Clear afterwards.
  if (isLocked(prev)) meta.lock = 1;
  S.plan[date][slot] = Object.keys(meta).length ? Object.assign({ id: id }, meta) : id;
  save();
}
function unsetMeal(date, slot){
  if (S.plan[date]){
    delete S.plan[date][slot];
    dropLeftoversOf(date, slot);
    if (S.plan[date] && !Object.keys(S.plan[date]).length) delete S.plan[date];
  }
  save();
}

/** Remove every serving that was being eaten as leftovers of one cooked meal. */
function dropLeftoversOf(date, slot){
  const ref = date + "|" + slot;
  let gone = 0;
  Object.keys(S.plan).forEach(d => {
    const day = S.plan[d];
    let hit = false;
    SLOTS.forEach(s => {
      if (isLeftover(day[s]) && day[s].from === ref){ delete day[s]; gone++; hit = true; }
    });
    // Only tidy away a day this actually emptied. A day that was already empty
    // is not its business -- and one of them is the day the caller just created
    // to write into, which deleting would pull out from under it.
    if (hit && !Object.keys(day).length) delete S.plan[d];
  });
  return gone;
}

function toggleLock(date, slot){
  const v = slotAt(date, slot);
  const id = idOf(v);
  if (!id) return;
  if (!S.plan[date]) S.plan[date] = {};
  if (isLocked(v)){
    const rest = Object.assign({}, v);
    delete rest.lock;
    S.plan[date][slot] = Object.keys(rest).length > 1 ? rest : id;
  } else {
    S.plan[date][slot] = Object.assign({ id: id }, typeof v === "object" ? v : null, { lock: 1 });
  }
  save();
}

const FILL_TOLERANCE = 120;
const FILL_LEVEL_KCAL = 40;
// Brunch takes breakfast's share and lunch's together, which is what makes fill
// reach for a 600 kcal shakshuka rather than a 150 kcal bowl of cereal: the
// target it aims at is the sum, and meals are ranked by how close they land.
// How much of the day each meal is aiming for. Shares are normalised over the
// slots a day actually has, so what matters is the ratio between them.
//
// Brunch is the odd one. It replaces two meals, so 0.60 looks like the obvious
// number -- but that puts the target near 990 kcal, and the only recipes up
// there are the eight biggest in the pool, so you get the same Full English
// every weekend. Measured over 50 filled weeks, dropping the share moves the
// target into a denser part of the catalogue and buys variety:
//
//   share  brunch  dinner  distinct brunches
//   0.25    610     988     7
//   0.33    723     869     5
//   0.45    852     741     3
//   0.60    932     662     3
//
// 0.33 is the balance: a brunch twice the size of a normal breakfast, a dinner
// that still looks like a weekend dinner, and enough choice to not repeat.
const SLOT_SHARE = { breakfast: 0.25, brunch: 0.33, lunch: 0.35, dinner: 0.40 };

/** Median of a list of numbers, used to judge what a typical meal looks like. */
function median(xs){
  if (!xs.length) return 0;
  const s = xs.slice().sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/** Whether the main meals can typically carry the protein goal on their own. */
function snackReserve(){
  const snacks = RECIPES.filter(r => r.slots.includes("snack"));
  if (!snacks.length) return 0;
  const typical = DAILY_SLOTS.reduce((n, slot) =>
    n + median(RECIPES.filter(r => r.slots.includes(slot)).map(r => r.macros.protein)), 0);
  if (S.goals.protein <= typical) return 0;
  return median(snacks.map(r => r.macros.kcal));
}

const SCOPES = [
  { id: null, label: "Anything" },
  { id: "high-protein", label: "High protein" },
  { id: "light", label: "Light" },
];

/* Recipes "fill empty slots" may choose from for a slot on a given day.
 *
 * Two things narrow the pool: the scope you picked, and how long you are willing
 * to spend cooking that day. Each is relaxed rather than allowed to empty the
 * pool, because a day left half-filled with no explanation is worse than a meal
 * that misses a preference. The time limit is the more practical of the two --
 * you cannot conjure an extra hour on a Tuesday -- so the scope gives way first.
 */
function fillPool(slot, date){
  const all = RECIPES.filter(r => servesSlot(r, slot));
  const cap = date ? timeCap(date) : 0;
  const inTime = cap ? all.filter(r => (r.total_min || 0) <= cap) : all;
  if (!S.scope) return inTime.length ? inTime : all;
  const scoped = inTime.filter(r => r.tags.includes(S.scope));
  if (scoped.length) return scoped;
  if (inTime.length) return inTime;
  const anyTime = all.filter(r => r.tags.includes(S.scope));
  return anyTime.length ? anyTime : all;
}

/* Ingredients already spoken for in the range being filled. Preferring a recipe
 * that reuses one of them is what stops a week needing half a tin of this and a
 * third of a bunch of that, all of which goes off before you use it again.
 * Cupboard staples are left out: oil and salt are in everything, so counting
 * them would make every recipe look equally thrifty and say nothing. */
function perishables(r){
  return r.ingredients
    .map(i => i.food)
    .filter(f => FOODS[f] && FOODS[f].aisle !== "cupboard");
}
function pantryFrom(ids){
  const set = new Set();
  ids.forEach(id => {
    const r = BY_ID[id];
    if (r) perishables(r).forEach(f => set.add(f));
  });
  return set;
}
function overlapWith(r, pantry){
  return perishables(r).reduce((n, f) => n + (pantry.has(f) ? 1 : 0), 0);
}

function fillRange(){
  const [a, b] = range();
  const dates = daysBetween(a, b);
  // Only the main meals you actually eat count as empty. A slot you have
  // scheduled off is not a gap, and a snack is a top-up rather than a gap --
  // but a day whose mains are all planned can still be short on protein, and
  // its empty snack tile is exactly where that shortfall gets closed.
  const openMains = d => MAIN_SLOTS.filter(s => eats(d, s) && !takenAt(d, s));
  const empty = dates.reduce((n, d) => n + openMains(d).length, 0);
  const openSnacks = dates.filter(d => !takenAt(d, "snack")).length;
  if (!empty && !openSnacks){ toast("Nothing empty to fill in this view"); return; }
  if (empty > 21 && !confirm(`Fill ${empty} empty meal slots across ${dates.length} days?`)) return;

  // Counted rather than assumed: a slot whose pool is empty is skipped, and the
  // protein top-up only lands when the day is short and has room for it.
  const planned = () => dates.reduce((n, d) =>
    n + SLOTS.filter(s => takenAt(d, s)).length, 0);
  const before = planned();
  const used = new Set(idsIn(a, b));
  const pantry = pantryFrom(idsIn(a, b, true));
  // Hold back roughly a snack's worth of calories when the protein goal is out of
  // reach of main meals alone, so there is room to top the day up afterwards.
  const reserve = snackReserve();
  dates.forEach(date => {
    const open = openMains(date);
    if (!open.length){
      // Every main is planned, but the day can still be under on protein.
      topUpProtein(date, used);
      planLeftovers(date, b, used);
      return;
    }
    // Spend what is left of the day's calorie goal across the slots still open,
    // so filling a day lands near your target instead of wherever chance falls.
    let budget = Math.max(0, S.goals.kcal - reserve - totalsOn(date).kcal);
    let share = open.reduce((n, s) => n + SLOT_SHARE[s], 0);

    open.forEach((slot, i) => {
      // A meal you always have is not a choice to make. It ignores the scope and
      // the time limit on purpose: you asked for this one by name, and a setting
      // meant to narrow a search should not overrule it.
      let pick = usualFor(slot);
      if (!pick){
        const pool = fillPool(slot, date);
        if (!pool.length) return;
        const target = share > 0 ? budget * (SLOT_SHARE[slot] / share) : 0;
        const fresh = pool.filter(r => !used.has(r.id));
        const rank = list => list.slice().sort((x, y) =>
          Math.abs(x.macros.kcal - target) - Math.abs(y.macros.kcal - target));
        // Prefer meals not already used in this period, but not at any price: once
        // the unused ones are a poor fit for what's left of the day, reuse one.
        let ranked = rank(fresh);
        if (!ranked.length || Math.abs(ranked[0].macros.kcal - target) > FILL_TOLERANCE){
          const all = rank(pool);
          if (!ranked.length || Math.abs(all[0].macros.kcal - target)
              < Math.abs(ranked[0].macros.kcal - target)) ranked = all;
        }
        // Shortlist the closest fits, then pick among them so weeks still vary.
        // The shortlist narrows as the day fills up, so the last meal is chosen to
        // close the gap on your goal rather than widen it.
        const width = Math.max(2, 6 - 2 * i);
        const shortlist = ranked.slice(0, Math.min(width, ranked.length));
        // Among fits that are equally good on calories, prefer protein, and prefer
        // a recipe that reuses ingredients the week already needs. The calorie
        // window is deliberately tight: leaning on anything else across a wide
        // spread drags the day well under its calorie goal.
        const bestGap = Math.abs(shortlist[0].macros.kcal - target);
        const level = shortlist.filter(r =>
          Math.abs(r.macros.kcal - target) <= bestGap + FILL_LEVEL_KCAL);
        const score = r => r.macros.protein + OVERLAP_WORTH * overlapWith(r, pantry);
        level.sort((x, y) => score(y) - score(x));
        pick = level[Math.floor(Math.random() * Math.min(2, level.length))];
      }
      setMeal(date, slot, pick.id);
      used.add(pick.id);
      perishables(pick).forEach(f => pantry.add(f));
      budget = Math.max(0, budget - pick.macros.kcal);
      share -= SLOT_SHARE[slot];
    });
    topUpProtein(date, used);
    planLeftovers(date, b, used);
  });
  render();
  const added = planned() - before;
  toast(added
    ? `Filled ${added} slot${added === 1 ? "" : "s"}`
    : "Nothing more to add: every day is on target or full");
}

// How much a shared ingredient is worth when choosing between meals that fit the
// day equally well, expressed in the grams of protein it will trade away.
//
// Tuned by measurement, not taste. Over 60 filled weeks per setting, raising it
// from 0 to 5 takes a week from 43.9 distinct perishables and 41.7 shopping
// lines down to 41.7 and 39.7, for one gram of protein a day and no change in
// calories. Past 5 it keeps buying less food but starts costing real protein
// (98 g a day at 40), which is the wrong trade for what this app is for.
//
// A variable rather than a constant so the effect can be measured with it off.
let OVERLAP_WORTH = 5;

/* Cook once, eat twice.
 *
 * A dish tagged `batch` makes more than one serving, so after cooking it there
 * is a second portion sitting in the fridge. Claim the next day's lunch with it
 * -- or its dinner, if lunch is not a meal you eat that day. The serving counts
 * towards what you eat and deliberately does not count towards what you buy.
 *
 * Only ever reaches one day forward, and never past the range being filled, so
 * filling a week cannot quietly rewrite the week after it.
 */
function planLeftovers(date, last, used){
  if (!S.leftovers) return;
  const next = addDays(date, 1);
  if (next > last) return;
  // Dinner first: it is the meal most likely to be a big cook, and the one whose
  // leftovers you would actually reach for the next day.
  const sources = ["dinner", "lunch", "brunch"].filter(s => {
    const v = slotAt(date, s);
    return v && !isLeftover(v) && BY_ID[idOf(v)] && BY_ID[idOf(v)].tags.includes("batch");
  });
  sources.some(from => {
    const r = BY_ID[idOf(slotAt(date, from))];
    // A slot you have pinned is spoken for: your usual beats yesterday's pot.
    const target = ["lunch", "brunch", "dinner"].find(s =>
      servesSlot(r, s) && eats(next, s) && !takenAt(next, s) && !usualFor(s));
    if (!target) return false;
    // Eating the same dish twice in one day is not leftovers, it is a rut.
    if (MAIN_SLOTS.some(s => idOf(slotAt(next, s)) === r.id)) return false;
    setMeal(next, target, r.id, { from: date + "|" + from });
    used.add(r.id);
    return true;
  });
}

/** Add a snack only when the day is short on protein and has calories spare. */
function topUpProtein(date, used){
  if (takenAt(date, "snack")) return;
  const day = totalsOn(date);
  const short = S.goals.protein - day.protein;
  if (short <= 0) return;
  const headroom = S.goals.kcal - day.kcal;
  const fits = RECIPES.filter(r => r.slots.includes("snack") && r.macros.kcal <= headroom);
  if (!fits.length) return;
  // Close as much of the protein gap as possible without going over on calories,
  // preferring the lighter snack when two are equally good.
  fits.sort((x, y) =>
    Math.min(y.macros.protein, short) - Math.min(x.macros.protein, short)
    || x.macros.kcal - y.macros.kcal);
  const best = fits.filter(r =>
    Math.min(r.macros.protein, short) === Math.min(fits[0].macros.protein, short));
  const fresh = best.filter(r => !used.has(r.id));
  const from = fresh.length ? fresh : best;
  const pick = from[Math.floor(Math.random() * from.length)];
  setMeal(date, "snack", pick.id);
  used.add(pick.id);
}

/** Clear one day's unlocked meals. Surviving a Clear is the entire point of a
 *  lock, so locked meals stay and are counted back for the caller to report. */
function clearDayMeals(date){
  const day = S.plan[date];
  if (!day) return { removed: 0, kept: 0 };
  const removed = [];
  let kept = 0;
  SLOTS.forEach(s => {
    if (!day[s]) return;
    if (isLocked(day[s])){ kept++; return; }
    delete day[s];
    removed.push(s);
  });
  if (!Object.keys(day).length) delete S.plan[date];
  removed.forEach(s => dropLeftoversOf(date, s));
  return { removed: removed.length, kept: kept };
}

function clearRange(){
  const [a, b] = range();
  const dates = daysBetween(a, b).filter(d => mealsOn(d).length);
  if (!dates.length){ toast("Nothing planned to clear"); return; }
  if (!confirm(`Clear every meal on ${dates.length} day${dates.length === 1 ? "" : "s"}?`)) return;
  let removed = 0, kept = 0;
  dates.forEach(d => {
    const r = clearDayMeals(d);
    removed += r.removed;
    kept += r.kept;
  });
  save();
  render();
  if (!removed) toast(`Nothing cleared: all ${kept} planned meals are locked`);
  else if (kept) toast(`Cleared ${removed} meal${removed === 1 ? "" : "s"}, kept ${kept} locked`);
}

function clearDay(date){
  if (!mealsOn(date).length){ toast("Nothing planned to clear"); return; }
  const r = clearDayMeals(date);
  save();
  render();
  if (!r.removed) toast(`Nothing cleared: ${fmtShort(date)} is locked`);
  else toast(r.kept
    ? `Cleared ${r.removed} on ${fmtShort(date)}, kept ${r.kept} locked`
    : `Cleared ${fmtShort(date)}`);
}

const PREVIOUS_LABEL = { day: "yesterday", week: "last week", month: "last month" };

/** Copy the previous period's plan onto the one on screen.
 *
 * Days are paired by position, so Monday lands on Monday. A source day with
 * nothing on it is skipped rather than copied, because an empty day is not a
 * plan and clearing what you already have is the opposite of what this button
 * is for -- anything genuinely being replaced is confirmed first.
 */
function copyPrevious(){
  const [a, b] = range();
  const target = daysBetween(a, b);
  let source;
  if (S.view === "month"){
    const prev = startOfMonth(addMonths(a, -1));
    source = daysBetween(prev, endOfMonth(prev));
  } else {
    const shift = S.view === "day" ? -1 : -7;
    source = target.map(d => addDays(d, shift));
  }

  const label = PREVIOUS_LABEL[S.view];
  const pairs = target
    .map((to, i) => [source[i], to])
    .filter(([from]) => from && mealsOn(from).length);
  if (!pairs.length){ toast(`Nothing planned ${label} to copy`); return; }

  const busy = pairs.filter(([, to]) => mealsOn(to).length).length;
  if (busy && !confirm(
    `Replace what is already planned on ${busy} day${busy === 1 ? "" : "s"}?`)) return;

  let meals = 0;
  const moved = {};
  pairs.forEach(([from, to]) => { moved[from] = to; });
  pairs.forEach(([from, to]) => {
    const src = S.plan[from] || {};
    const dst = {};
    // A lock means "not without asking me", so it outranks a bulk copy.
    SLOTS.forEach(s => { if (isLocked(slotAt(to, s))) dst[s] = S.plan[to][s]; });
    SLOTS.forEach(s => {
      if (dst[s] || !src[s]) return;
      const v = src[s];
      if (isLeftover(v)){
        // Leftovers have to point at the copy of the meal they came from. If
        // that meal is not being copied too, this serving was never cooked --
        // so keep the dish, but as one you cook and shop for yourself.
        const parts = String(v.from).split("|");
        const landed = moved[parts[0]];
        dst[s] = landed ? Object.assign({}, v, { from: landed + "|" + parts[1] }) : idOf(v);
      } else {
        dst[s] = v;
      }
      meals++;
    });
    S.plan[to] = dst;
  });
  save();
  render();
  toast(`Copied ${meals} meal${meals === 1 ? "" : "s"} from ${label}`);
}

/* ===== events ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-view],[data-step],[data-today],[data-day]," +
    "[data-pick],[data-slot-tap],[data-set],[data-open],[data-close],[data-unset]," +
    "[data-fill],[data-clear],[data-clearday],[data-copyprev],[data-fslot]," +
    "[data-newlist],[data-gen]," +
    "[data-tick],[data-rm],[data-edit],[data-untick],[data-copy],[data-resetgoals]," +
    "[data-blank],[data-clearitems]," +
    "[data-lock],[data-fillset],[data-slotday],[data-maxmin],[data-leftovers]," +
    "[data-usual],[data-unusual]," +
    "[data-addsnack],[data-portions],[data-scope],[data-ftag]");
  if (!t) return;
  const d = t.dataset;

  if (d.tab){ tab = d.tab; render(); return; }
  if (d.close){ closeSheet(); return; }

  /* period navigation */
  if (d.view){ S.view = d.view; save(); render(); return; }
  if (d.step){
    const n = Number(d.step);
    S.cursor = S.view === "day" ? addDays(S.cursor, n)
             : S.view === "week" ? addDays(S.cursor, n * 7)
             : addMonths(S.cursor, n);
    save(); render(); return;
  }
  if (d.today){ S.cursor = todayISO(); save(); render(); return; }
  if (d.day){ S.cursor = d.day; S.view = "day"; save(); render(); return; }

  /* plan */
  if (d.pick){ const [date, slot] = d.pick.split("|"); pickSheet(date, slot); return; }
  if (d.slotTap){ const [date, slot] = d.slotTap.split("|"); slotSheet(date, slot); return; }
  if (d.set){
    // The same rows serve the plan picker and the pin picker; which one is open
    // decides whether this sets a day's meal or a standing choice.
    const pinned = sheet.dataset.usual;
    if (pinned){
      S.usual[pinned] = d.set;
      save();
      fillSettingsSheet();
      render();
      toast(`${BY_ID[d.set].name} is now your usual ${SLOT_LABEL[pinned].toLowerCase()}`);
      return;
    }
    const date = sheet.dataset.date, slot = sheet.dataset.slot;
    setMeal(date, slot, d.set);
    closeSheet(); render();
    toast(`${BY_ID[d.set].name} set for ${fmtDate(date)}`);
    return;
  }
  if (d.unusual){
    S.usual[d.unusual] = null;
    save();
    fillSettingsSheet();
    render();
    return;
  }
  if (d.unset){
    const [date, slot] = d.unset.split("|");
    unsetMeal(date, slot);
    closeSheet(); render();
    return;
  }
  if (d.open){ recipeSheet(d.open); return; }
  if (d.portions){
    const [rid, n] = d.portions.split("|");
    recipeSheet(rid, Number(n));
    return;
  }
  if (d.addsnack){
    const [date, id] = d.addsnack.split("|");
    setMeal(date, "snack", id);
    render();
    toast(`${BY_ID[id].name} added to ${fmtDate(date)}`);
    return;
  }
  // "scope" in d rather than d.scope: "Anything" is data-scope="", which is
  // falsy, so a truthiness check would make that button silently do nothing.
  if ("scope" in d){ S.scope = d.scope || null; save(); render(); return; }
  if (d.fill){ fillRange(); return; }
  if (d.clear){ clearRange(); return; }
  if (d.clearday){ clearDay(d.clearday); return; }
  if (d.copyprev){ copyPrevious(); return; }
  if (d.lock){
    const [date, slot] = d.lock.split("|");
    toggleLock(date, slot);
    closeSheet(); render();
    toast(isLocked(slotAt(date, slot))
      ? `${SLOT_LABEL[slot]} locked: Clear will leave it alone`
      : `${SLOT_LABEL[slot]} unlocked`);
    return;
  }
  if (d.fillset){ fillSettingsSheet(); return; }
  if (d.usual){ usualPickSheet(d.usual); return; }
  if (d.slotday){
    const [slot, i] = d.slotday.split("|");
    const days = S.slotDays[slot];
    days[Number(i)] = !days[Number(i)];
    save(); fillSettingsSheet(); render();
    return;
  }
  if (d.maxmin){
    const [key, m] = d.maxmin.split("|");
    S.maxMin[key] = Number(m);
    save(); fillSettingsSheet(); render();
    return;
  }
  // "leftovers" in d, not d.leftovers: Off is data-leftovers="", which is falsy.
  if ("leftovers" in d){ S.leftovers = !!d.leftovers; save(); fillSettingsSheet(); render(); return; }
  /* recipe filters, shared by the Recipes tab and the plan's meal picker.
     Meal and Filter are buttons; only Type is a select, handled on "change". */
  const reFilter = ns => {
    if (ns === "pick") reopenPicker();
    else render();
  };
  if (d.fslot){
    const [ns, slot] = d.fslot.split("|");
    const f = ns === "pick" ? pickFilter : filter;
    f.slot = f.slot === slot ? null : slot;
    // The Type row is scoped to the chosen meal, so a category that no longer
    // applies would otherwise stay selected and silently show nothing.
    if (f.cat && !RECIPES.some(r => r.category === f.cat && (!f.slot || servesSlot(r, f.slot)))){
      f.cat = null;
    }
    reFilter(ns);
    return;
  }
  // Filter takes any number of tags at once, each one narrowing further, so
  // "Vegetarian" and "High protein" together mean both rather than either.
  if (d.ftag){
    const [ns, tag] = d.ftag.split("|");
    const f = ns === "pick" ? pickFilter : filter;
    f.tags = f.tags.includes(tag) ? f.tags.filter(t => t !== tag) : f.tags.concat(tag);
    reFilter(ns);
    return;
  }

  /* shopping */
  if (d.newlist){ newListSheet(); return; }
  if (d.blank){
    // Replacing a list that still has things on it is worth a question.
    if (S.shopping && S.shopping.items.length
      && !confirm(`Replace the current list? ${S.shopping.items.length} item${
        S.shopping.items.length === 1 ? "" : "s"} will be lost.`)) return;
    S.shopping = blankList();
    save(); closeSheet(); render();
    toast("Blank list ready");
    return;
  }
  if (d.clearitems){
    if (!S.shopping || !S.shopping.items.length){ toast("The list is already empty"); return; }
    const n = S.shopping.items.length;
    if (!confirm(`Remove all ${n} item${n === 1 ? "" : "s"} from the list?`)) return;
    // Nothing from the plan survives, so the list stops claiming those days.
    S.shopping.items = [];
    S.shopping.from = null;
    S.shopping.to = null;
    save(); render();
    toast(`Removed ${n} item${n === 1 ? "" : "s"}`);
    return;
  }
  if (d.gen){ const [from, to] = d.gen.split("|"); createList(from, to, true); return; }
  if (d.tick){
    const item = S.shopping.items.find(i => i.id === d.tick);
    if (item){ item.ticked = !item.ticked; save(); render(); }
    return;
  }
  if (d.rm){
    const i = S.shopping.items.findIndex(x => x.id === d.rm);
    if (i >= 0){
      const [gone] = S.shopping.items.splice(i, 1);
      save(); closeSheet(); render();
      toast(`Removed ${gone.name}`);
    }
    return;
  }
  if (d.edit){ editItemSheet(d.edit); return; }
  if (d.untick){
    S.shopping.items.forEach(i => { i.ticked = false; });
    save(); render(); toast("Ticks cleared");
    return;
  }
  if (d.copy){ copyList(); return; }

  /* nutrients */
  if (d.resetgoals){
    S.goals = Object.assign({}, DATA.targets);
    save(); render(); toast("Goals reset to defaults");
    return;
  }
});

// One listener covers both search boxes: the Recipes tab and the plan's picker.
/* The Type and Filter dropdowns. Selects report on "change", not "click", so
   they cannot ride the delegated click handler the buttons use. */
document.addEventListener("change", e => {
  const ds = e.target.dataset;
  if (!ds) return;
  const ns = ds.fcatsel;
  if (!ns) return;
  const f = ns === "pick" ? pickFilter : filter;
  const value = e.target.value || null;
  f.cat = value;
  if (ns === "pick") reopenPicker();
  else render();
});

document.addEventListener("input", e => {
  const ns = e.target.dataset && e.target.dataset.search;
  if (!ns) return;
  const pos = e.target.selectionStart;
  if (ns === "pick"){
    pickFilter.q = e.target.value;
    reopenPicker();
  } else {
    filter.q = e.target.value;
    render();
  }
  restoreSearch("q-" + ns, pos);
});

document.addEventListener("submit", e => {
  const form = e.target;

  if (form.id === "addf"){
    e.preventDefault();
    const input = document.getElementById("addi");
    const value = input.value.trim();
    if (!value) return;
    // Typing an item with no list yet starts your own, not one claiming today.
    if (!S.shopping) S.shopping = blankList();
    S.shopping.items.push({
      id: newItemId(), name: value, qty: "", aisle: "other",
      aisleLabel: "Added by you", note: "", ticked: false, manual: true,
    });
    save(); render();
    const again = document.getElementById("addi");
    if (again) again.focus();
    return;
  }

  if (form.id === "rangef"){
    e.preventDefault();
    const data = new FormData(form);
    createList(data.get("from"), data.get("to"), data.get("staples") !== null);
    return;
  }

  if (form.id === "editf"){
    e.preventDefault();
    const data = new FormData(form);
    const item = S.shopping.items.find(i => i.id === form.dataset.id);
    if (item){
      const name = String(data.get("name")).trim();
      if (!name){ toast("An item needs a name"); return; }
      item.name = name;
      item.qty = String(data.get("qty")).trim();
      save();
    }
    closeSheet(); render();
    return;
  }

  if (form.id === "goalf"){
    e.preventDefault();
    const data = new FormData(form);
    const next = {};
    for (const m of MACROS){
      const raw = Number(data.get(m.key));
      if (!Number.isFinite(raw) || raw < 0){ toast(`${m.label} must be a positive number`); return; }
      next[m.key] = Math.round(raw);
    }
    S.goals = next;
    save(); render(); toast("Goals saved");
    return;
  }
});

render();

// Said once, after the first render: silently dropping planned meals would
// leave the plan looking wrong for no stated reason.
if (pruned){
  toast(`${pruned} planned meal${pruned === 1 ? " is" : "s are"} no longer in the catalogue and ${
    pruned === 1 ? "was" : "were"} cleared`);
}

/* Register the service worker so the app opens offline and still updates
 * itself. Only meaningful over http(s); opening the file directly from a
 * phone's storage skips this and simply runs without offline caching. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(
      reg => {
        reg.addEventListener("updatefound", () => {
          const fresh = reg.installing;
          if (!fresh || !navigator.serviceWorker.controller) return;
          fresh.addEventListener("statechange", () => {
            if (fresh.state === "installed") toast("Updating to the latest version...");
          });
        });
      },
      () => {}  // refused (private mode or unsupported): the app still works
    );
  });
}
</script>
